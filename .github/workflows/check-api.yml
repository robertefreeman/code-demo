name: Check AI response
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Non-private diagnostic prompt (workflow inputs are visible in GitHub)"
        required: true
        type: string
        default: "A single blue circle centered on a white background. Use only SVG."
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect one diagnostic response without logging its text
        run: node scripts/check-api.mjs
        env:
          DIAGNOSTIC_PROMPT: ${{ inputs.prompt }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
